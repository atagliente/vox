name: Something is missing
description: A thing VOX should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: >
        The task, not the feature. What the missing thing would let you
        finish is more useful than the shape you imagine it having.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you think it should look like
      description: Optional. A command, a setting, a key — whatever you had in mind.

  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit what VOX is
      description: >
        Not a test to pass, just things that will come up. Answering them
        here saves a round trip.
      options:
        - label: It works without a network connection, or explains why it cannot
        - label: It needs no dependency beyond the four VOX already has
        - label: It is off until asked for, if it talks to anything or writes anything
