name: CI

# Every push and every pull request. The jobs are separate on purpose: a
# formatting slip should not hide behind an eight-minute test run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      # Strict, over the modules that are already clean. The list in
      # pyproject.toml is what widens, not this step.
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q

  security:
    # Two different questions: is anything VOX depends on known to be
    # vulnerable, and does VOX itself do something careless. Neither answers
    # the other.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install pip-audit bandit
      - name: Known vulnerabilities in the dependencies
        run: pip-audit --strict --progress-spinner off .
      - name: Careless patterns in the source
        # Tests are excluded: they open sockets and run subprocesses on
        # purpose, and a report full of those is a report nobody reads.
        run: bandit -r vox_chat -ll
      - name: The lock file still matches pyproject.toml
        # uv, not pip-compile: pip-tools resolves for the machine it runs on,
        # so a lock made on Windows and checked on Linux differs by
        # colorama every single time. --universal emits the markers instead,
        # which makes the file correct everywhere and this check meaningful.
        run: |
          pip install uv
          uv pip compile --universal --generate-hashes --quiet             --python-version 3.11             --output-file /tmp/check.lock pyproject.toml
          # Compare the pins, not the header comments.
          grep -v '^#' requirements.lock | grep -v '^$' > /tmp/have.txt
          grep -v '^#' /tmp/check.lock   | grep -v '^$' > /tmp/want.txt
          if ! diff -u /tmp/have.txt /tmp/want.txt; then
            echo "requirements.lock is stale; regenerate it (see its header)."
            exit 1
          fi

  coverage:
    # One run, on one interpreter: coverage is a number about the code, not
    # about the platform, and nine of them would cost eight minutes each.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      # The floor lives in pyproject.toml and only ever moves up.
      - run: pytest -q --cov --cov-report=xml --cov-report=term-missing
      - name: Post the figures on the pull request
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # The marker is what makes the annotations reach anyone installing this.
      - run: python -c "import zipfile,glob;w=glob.glob('dist/*.whl')[0];assert 'vox_chat/py.typed' in zipfile.ZipFile(w).namelist(), 'py.typed missing from the wheel'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  installers:
    # 23 KB of installer that nothing else exercises. Clean runners, so a
    # missing prerequisite shows up here rather than on someone's machine.
    #
    # Every step runs under bash, including on Windows, where the runner
    # ships Git Bash and pwsh is a command it can call. The shell is not
    # taken from the matrix because GitHub evaluates `shell:` before the
    # matrix exists and refuses to start the whole run over it — which is
    # what every failed run of this file was, before the tests ever ran.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: sh install.sh --yes
            uninstall: sh install.sh --uninstall --yes
          - os: macos-latest
            install: sh install.sh --yes
            uninstall: sh install.sh --uninstall --yes
          - os: windows-latest
            install: pwsh -File ./install.ps1 -Yes
            uninstall: pwsh -File ./install.ps1 -Uninstall -Yes
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: ${{ matrix.install }}
      - name: Install again — it claims to be idempotent
        shell: bash
        run: ${{ matrix.install }}
      - name: Uninstall
        shell: bash
        run: ${{ matrix.uninstall }}
