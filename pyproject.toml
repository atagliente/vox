[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vox"
# Read from vox_chat/__init__.py, so there is one place the version lives.
# It was written here as well, with nothing checking the two agreed.
dynamic = ["version"]
description = "VOX - retro terminal chat client for OpenAI-compatible providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [{ name = "atagliente" }]
keywords = ["tui", "llm", "ollama", "chat", "coding-agent"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  # Added because CI runs the suite on it, not because it ought to work.
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  # Upper bounds on the majors, because these are the surfaces VOX actually
  # calls and 1.x and 2.x of the OpenAI SDK do not share one. ">=1.30" said
  # a version this has never been run against would do.
  "openai>=2.0,<3",
  "textual>=8.0,<9",
  "rich>=13.0,<16",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "ruff>=0.16",
  "mypy>=1.11",
  "nox>=2024.4",
  "pre-commit>=4.6.2",
  # Only the workflow test reads YAML. It is here rather than in the
  # runtime dependencies because VOX itself never parses any.
  "pyyaml>=6.0",
]

[project.scripts]
vox = "vox_chat.__main__:main"

[project.urls]
Homepage = "https://github.com/atagliente/vox"

[tool.hatch.version]
path = "vox_chat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vox_chat"]
# The demo authority ships so a fresh download joins a mesh without
# provisioning, and py.typed is what lets a type checker downstream see the
# annotations. hatchling includes package data by default; these are named
# because they are the two that would be missed if it did not.
artifacts = ["vox_chat/py.typed", "vox_chat/demo_pki/*"]

[tool.hatch.build.targets.sdist]
include = ["vox_chat", "tests", "docs", "README.md", "LICENSE", "spec.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# -n auto by default: the suite is 9m15s serial and 1m43s across the cores
# here, and conftest.py already gives every test its own VOX_HOME, so there
# is nothing shared to race over. `-p no:xdist` or `-n0` turns it off when a
# traceback is easier to read in one process.
addopts = "-n auto"
markers = [
  "slow: binds real sockets, waits on real timers, or otherwise costs seconds",
]
# A stalled handshake should fail the test, not hang CI for six hours. The
# thread method is the one that works on Windows, where there is no SIGALRM.
timeout = 120
timeout_method = "thread"

[tool.coverage.run]
source = ["vox_chat"]
branch = true
omit = [
  # The vendored demo authority is data, and __main__ is the entry point the
  # tests drive through the app rather than by importing it.
  "vox_chat/demo_pki/*",
]

[tool.coverage.report]
# The defensive branches are already marked in the source, one comment each
# saying why they cannot be reached from a test.
exclude_also = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
# The level measured on 2026-09-02 over 514 tests: 76%, branch coverage on.
# It is a ratchet, not a target — it moves up when a change earns it, never
# down to accommodate one.
fail_under = 76

[tool.mypy]
python_version = "3.11"
# textual, rich and openai ship types unevenly; demanding stubs for them would
# mean silencing more than it found.
ignore_missing_imports = true
strict = true
# The pure modules first — no UI, no sockets, no provider — because they are
# already clean under strict and can be held there from today. The rest of the
# tree reports around a hundred findings; it joins this list one module at a
# time, as each is cleared, rather than all at once behind a wall of silencing.
files = [
  "vox_chat/code_blocks.py",
  "vox_chat/inspection.py",
  "vox_chat/models.py",
  "vox_chat/reasoning.py",
  "vox_chat/usage.py",
]

[tool.ruff]
# 88 is what the code already does by hand; the formatter has to agree with
# the existing diff, not rewrite 21k lines to introduce itself.
line-length = 88
target-version = "py311"
# build/lib is a stale copy of the package left by setuptools, not source.
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # The formatter enforces the width; what E501 has left to complain about is
  # string literals it cannot split — SVG, HTML fixtures, message text — and
  # breaking those by hand makes them harder to read, not easier.
  "E501",
  # Textual takes BINDINGS, and this code takes KEYS, as class-level lists.
  # That is the framework's API, not a mutable default by accident.
  "RUF012",
  # The interface text uses real typography — en dashes, curly quotes, middle
  # dots. They are deliberate, not homoglyphs slipped in by mistake.
  "RUF001",
]
